<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SCAFO produkcja</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="/SCAFO/manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEFED;--bg2:#E8E8E5;--bg3:#DDDDD9;
  --tx:#1A1A18;--tx2:#5F5E5A;
  --blue:#185FA5;--lblue:#E6F1FB;
  --green:#3B6D11;--lgreen:#EAF3DE;
  --red:#E24B4A;--lred:#FCEBEB;
  --amber:#633806;--lamber:#FAEEDA;
  --purple:#3C3489;--lpurple:#EEEDFE;
  --teal:#085041;--lteal:#E1F5EE;
  --bdr:#CFCFCC;
  --font:'Noto Sans',sans-serif;
  --r:10px;--rsm:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;overscroll-behavior:none;}
#app{max-width:480px;margin:0 auto;min-height:100vh;}
.screen{display:none;min-height:100vh;padding-bottom:20px;}
.screen.active{display:block;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--bdr);}
.topbar h2{font-size:16px;font-weight:600;}

.tabs{display:flex;gap:4px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:thin;flex-wrap:wrap;}
.tabs::-webkit-scrollbar{height:3px;}
.tabs::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px;}
.tab{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--bg2);color:var(--tx2);border:none;cursor:pointer;font-family:var(--font);}
.tab.active{background:var(--blue);color:#fff;}

.card{background:var(--bg2);border-radius:var(--r);padding:14px;margin:0 16px 10px;}
.card-title{font-size:13px;font-weight:600;margin-bottom:10px;}
.section{padding:12px 16px 0;}
.section-title{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}

.item{background:var(--bg2);border-radius:var(--r);padding:12px 14px;margin:0 16px 8px;display:flex;align-items:center;gap:10px;}
.item-main{flex:1;min-width:0;}
.item-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-sub{font-size:12px;color:var(--tx2);margin-top:2px;}

.form-group{margin-bottom:12px;}
.label{font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:4px;display:block;}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=email],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:var(--rsm);font-size:14px;font-family:var(--font);background:var(--bg);color:var(--tx);outline:none;transition:border .15s;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);}
textarea{resize:none;height:72px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--rsm);font-size:14px;font-weight:500;font-family:var(--font);border:none;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.btn:active{opacity:.8;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-success{background:var(--green);color:#fff;}
.btn-danger{background:var(--red);color:#fff;}
.btn-ghost{background:var(--bg3);color:var(--tx);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-block{width:100%;}
.btn i{font-size:16px;}
.btn-sm i{font-size:14px;}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-blue{background:var(--lblue);color:var(--blue);}
.badge-green{background:var(--lgreen);color:var(--green);}
.badge-red{background:var(--lred);color:var(--red);}
.badge-amber{background:var(--lamber);color:var(--amber);}
.badge-purple{background:var(--lpurple);color:var(--purple);}
.badge-teal{background:var(--lteal);color:var(--teal);}

.progress{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:6px 0;}
.progress-bar{height:100%;background:var(--blue);border-radius:3px;transition:width .3s;}

.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.avatar-sm{width:28px;height:28px;font-size:11px;}
.avatar-lg{width:48px;height:48px;font-size:16px;}

.divider{height:1px;background:var(--bdr);margin:12px 0;}
.empty{text-align:center;padding:40px 20px;color:var(--tx2);}
.empty i{font-size:40px;margin-bottom:12px;display:block;}
.empty p{font-size:14px;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:var(--r) var(--r) 0 0;padding:20px 16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;}

#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90vw;}
#toast.show{opacity:1;}
#toast.success{background:#1a1a18;color:#fff;}
#toast.error{background:#791F1F;color:#fff;}

#cloud-warn{display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--red);color:#fff;padding:8px 16px;z-index:50;font-size:12px;font-weight:500;text-align:center;}

.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;transition:background .3s;}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* LOGIN */
#screen-login{padding-bottom:0;}
.login-header{padding:48px 24px 32px;text-align:center;}
.login-title{font-size:26px;font-weight:700;margin-bottom:4px;}
.login-sub{font-size:14px;color:var(--tx2);}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 20px;}
.user-card{background:var(--bg2);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;border:2px solid transparent;}
.user-card:active{border-color:var(--blue);}
.user-card .avatar{margin:0 auto 8px;}
.user-card-name{font-size:13px;font-weight:500;}
.user-card-role{font-size:11px;color:var(--tx2);margin-top:2px;}
.pin-screen{padding:24px 16px;display:none;}
.pin-display{font-size:36px;letter-spacing:20px;text-align:center;height:52px;margin-bottom:24px;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto;}
.pin-btn{padding:18px;border-radius:var(--r);font-size:22px;font-weight:600;background:var(--bg2);border:none;cursor:pointer;font-family:var(--font);}
.pin-btn:active{background:var(--bg3);}

/* PIECEWORK QUICK ENTRY */
.quick-entry{background:var(--blue);border-radius:var(--r);padding:16px;margin:0 16px 12px;}
.quick-entry-title{color:#fff;font-size:13px;font-weight:500;margin-bottom:12px;}
.quick-select{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:var(--rsm);color:#fff;padding:10px 12px;width:100%;font-size:14px;font-family:var(--font);margin-bottom:8px;-webkit-appearance:none;}
.quick-select option{background:var(--bg);color:var(--tx);}
.quick-qty{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:var(--rsm);color:#fff;padding:10px 12px;width:100%;font-size:22px;font-weight:600;font-family:var(--font);text-align:center;margin-bottom:8px;}
.quick-qty::placeholder{color:rgba(255,255,255,.5);}
.quick-earn-preview{color:rgba(255,255,255,.85);font-size:14px;font-weight:600;text-align:center;margin-bottom:10px;min-height:20px;}

/* EARN STATS */
.earn-stat{background:var(--bg2);border-radius:var(--r);padding:14px;text-align:center;}
.earn-stat-val{font-size:22px;font-weight:700;color:var(--green);}
.earn-stat-label{font-size:11px;color:var(--tx2);margin-top:2px;}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day-name{text-align:center;font-size:10px;color:var(--tx2);padding:3px 0;font-weight:500;}
.cal-day{min-height:52px;border-radius:var(--rsm);background:var(--bg2);padding:3px;cursor:pointer;border:1.5px solid transparent;}
.cal-day.has-data{background:var(--lgreen);}
.cal-day.today{border-color:var(--blue);}
.cal-day-num{font-size:11px;font-weight:500;}
.cal-day.today .cal-day-num{color:var(--blue);}
.cal-day-earn{font-size:9px;color:var(--green);font-weight:600;}
.cal-day-qty{font-size:9px;color:var(--tx2);}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-nav-title{font-size:14px;font-weight:600;text-transform:capitalize;}

/* PRINT */
@media print{body>*:not(#print-area){display:none!important;}#print-area{display:block!important;}@page{margin:15mm;}}
#print-area{display:none;}

/* LOADER */
#app-loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.loader-icon{font-size:52px;color:var(--blue);margin-bottom:16px;}
.loader-title{font-size:18px;font-weight:700;margin-bottom:6px;}
.loader-sub{font-size:13px;color:var(--tx2);}
.loader-spinner{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-top:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app-loader">
  <i class="ti ti-building-factory-2 loader-icon"></i>
  <div class="loader-title">SCAFO produkcja</div>
  <div class="loader-sub">Łączenie z chmurą...</div>
  <div class="loader-spinner"></div>
</div>
<div id="cloud-warn">⚠️ Brak połączenia z chmurą — dane mogą nie być zapisane</div>
<div id="toast"></div>
<div id="print-area"></div>
<div id="app"></div>

<script>
'use strict';
// ══════════════════════════════════
// SUPABASE
// ══════════════════════════════════
const SUPA_URL='https://orshwfdzvcyzqssvtxgn.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yc2h3ZmR6dmN5enFzc3Z0eGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDk0OTQsImV4cCI6MjA5NjE4NTQ5NH0.2od9zzYaFb6vClzbznj9KC-FCOhW4cx8t44BvQ1OGdI';
const SUPA_H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'};

async function supaFetch(url,opts={}){
  const res=await fetch(SUPA_URL+url,{...opts,headers:{...SUPA_H,...(opts.headers||{})}});
  if(!res.ok){const e=await res.text().catch(()=>'');throw new Error('Supabase '+res.status+': '+e);}
  if(res.status===204||res.status===201)return null;
  const text=await res.text().catch(()=>'');
  if(!text||!text.trim())return null;
  try{return JSON.parse(text);}catch(e){return null;}
}

// ══════════════════════════════════
// DB
// ══════════════════════════════════
let DB={workers:[],catalog:[],orders:[],reports:[],shipments:[],adjustments:[],payouts:[],transports:[],vacations:[]};
let isSyncing=false;
let pendingSync=false;

function saveLocal(){
  try{
    const keys=['workers','catalog','orders','reports','shipments','adjustments','payouts','transports','vacations'];
    keys.forEach(k=>localStorage.setItem('scafo_'+k,JSON.stringify(DB[k])));
  }catch(e){console.error('Local save:',e);}
}

function loadLocal(){
  const keys=['workers','catalog','orders','reports','shipments','adjustments','payouts','transports','vacations'];
  keys.forEach(k=>{try{DB[k]=JSON.parse(localStorage.getItem('scafo_'+k)||'[]');}catch(e){DB[k]=[];}});
}

async function cloudSave(){
  if(isSyncing){pendingSync=true;return false;}
  isSyncing=true;setSyncStatus('syncing');
  try{
    await supaFetch('/rest/v1/scafo_data',{method:'POST',body:JSON.stringify({id:'main',...DB,updated_at:new Date().toISOString()})});
    saveLocal();
    setSyncStatus('ok');
    hideCloudWarn();
    doBackup();
    if(pendingSync){pendingSync=false;setTimeout(cloudSave,500);}
    return true;
  }catch(e){
    console.error('Cloud save:',e);
    setSyncStatus('error');
    showCloudWarn();
    return false;
  }finally{isSyncing=false;}
}

async function cloudLoad(){
  try{
    const rows=await supaFetch('/rest/v1/scafo_data?id=eq.main&select=*');
    if(!rows?.length){loadLocal();return false;}
    const d=rows[0];
    const localR=JSON.parse(localStorage.getItem('scafo_reports')||'[]');
    const cloudR=d.reports||[];
    const cloudUpdated=new Date(d.updated_at||0);
    const localUpdated=new Date(localStorage.getItem('scafo_updated_at')||0);
    // Use cloud data only if it has more reports OR is newer than local
    if(cloudR.length>=localR.length){
      const keys=['workers','catalog','orders','reports','shipments','adjustments','payouts','transports','vacations'];
      keys.forEach(k=>{if(Array.isArray(d[k])) DB[k]=d[k];});
      localStorage.setItem('scafo_updated_at',d.updated_at||'');
      saveLocal();
    } else {
      loadLocal();
      setTimeout(cloudSave,1000);
    }
    return true;
  }catch(e){
    console.error('Cloud load:',e);
    loadLocal();
    return false;
  }
}

async function save(){
  saveLocal();
  const ok=await cloudSave();
  if(!ok) showToast('Zapisano lokalnie (brak połączenia z chmurą)',true);
  return ok;
}

async function doBackup(){
  try{
    const now=new Date();
    const key=`bk_${now.getFullYear()}_${now.getMonth()+1}_${now.getDate()}_${now.getHours()}`;
    const last=localStorage.getItem('scafo_last_bk');
    if(last===key)return;
    await supaFetch('/rest/v1/scafo_backups',{method:'POST',body:JSON.stringify({id:key,date:today(),data:JSON.stringify(DB),created_at:now.toISOString()})});
    localStorage.setItem('scafo_last_bk',key);
  }catch(e){console.warn('Backup failed:',e);}
}

window.addEventListener('online',async()=>{hideCloudWarn();setSyncStatus('ok');if(pendingSync){pendingSync=false;await cloudSave();}});
window.addEventListener('offline',()=>{showCloudWarn();setSyncStatus('error');});

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&currentUser){
    cloudLoad().then(()=>refreshScreen());
  }
});

// ══════════════════════════════════
// HELPERS
// ══════════════════════════════════
function today(){const d=new Date();return`${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;}
function todayISO(){return new Date().toISOString().slice(0,10);}
function nowTime(){return new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});}
function initials(n){if(!n||typeof n!=='string')return'??';return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function fmt(n){return Number(n||0).toFixed(2).replace('.',',');}
function pct(a,b){return b>0?Math.min(100,Math.round(a/b*100)):0;}
function uid(){return Date.now()+Math.floor(Math.random()*9999);}
function plToISO(d){if(!d)return'';const p=d.split('.');return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:d;}
function isoToPL(iso){if(!iso)return'';const d=new Date(iso);return`${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;}

function sortedCatalog(filter){
  let c=[...DB.catalog].sort((a,b)=>a.name.localeCompare(b.name,'pl'));
  if(filter==='piecework')c=c.filter(x=>x.piecework);
  return c;
}

function earn(r){
  if(r.shift!=='popołudnie'||!r.catalogId)return 0;
  const c=DB.catalog.find(x=>String(x.id)===String(r.catalogId));
  return Math.round(Number(c?.rate||0)*r.qtyDone*100)/100;
}

function orderItemDone(oid,catId,itemName){
  const prod=DB.reports.filter(r=>String(r.orderId)===String(oid)&&(catId?String(r.catalogId)===String(catId):r.name===itemName)).reduce((a,r)=>a+r.qtyDone,0);
  const o=DB.orders.find(x=>String(x.id)===String(oid));
  const item=o?.items?.find(i=>catId?String(i.catId)===String(catId):i.name===itemName);
  return prod+(item?.stock||0);
}

function orderTotalDone(oid){
  const o=DB.orders.find(x=>String(x.id)===String(oid));
  if(!o?.items)return 0;
  return o.items.reduce((sum,item)=>sum+orderItemDone(oid,item.catId,item.name),0);
}

function physicalStock(catId){
  if(!catId)return 0;
  const c=DB.catalog.find(x=>String(x.id)===String(catId));
  if(c?.stockItem===false)return 0;
  const produced=DB.reports.filter(r=>String(r.catalogId)===String(catId)&&!r.orderId).reduce((a,r)=>a+r.qtyDone,0);
  const adj=DB.adjustments.filter(a=>String(a.catId)===String(catId)).reduce((a,x)=>{
    if(['opening','purchase','correction_plus'].includes(x.type))return a+x.qty;
    if(['correction_minus','sale'].includes(x.type))return a-x.qty;
    return a;
  },0);
  const shipped=DB.shipments.filter(s=>s.confirmed).reduce((a,s)=>{
    const it=s.items?.find(i=>String(i.catId)===String(catId));
    return a+(it?it.qty:0);
  },0);
  return Math.max(0,produced+adj-shipped);
}

function normDate(d){if(!d)return'';const p=d.split('.');return p.length===3?`${p[0].padStart(2,'0')}.${p[1].padStart(2,'0')}.${p[2]}`:d;}

// ══════════════════════════════════
// UI HELPERS
// ══════════════════════════════════
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const s=document.getElementById(id);if(s)s.classList.add('active');}
function showToast(msg,isErr=false){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.className='show '+(isErr?'error':'success');clearTimeout(el._t);el._t=setTimeout(()=>el.className='',3500);}
function showCloudWarn(){const el=document.getElementById('cloud-warn');if(el)el.style.display='block';}
function hideCloudWarn(){const el=document.getElementById('cloud-warn');if(el)el.style.display='none';}
function setSyncStatus(s){document.querySelectorAll('.sync-dot').forEach(d=>d.className='sync-dot '+s);}
function openModal(id){document.getElementById(id)?.classList.add('open');}
function closeModal(id){document.getElementById(id)?.classList.remove('open');}

// ══════════════════════════════════
// AUTH
// ══════════════════════════════════
let currentUser=null;
let pinBuffer='';
let pendingUser=null;

function renderLogin(){
  const app=document.getElementById('app');
  const tiles=DB.workers.filter(w=>w.active!==false).map(w=>`
    <div class="user-card" onclick="selectUser(${w.id})">
      <div class="avatar avatar-lg">${initials(w.name)}</div>
      <div class="user-card-name">${w.name}</div>
      <div class="user-card-role">${w.role==='piecework'?'Akordowy':w.role==='manager'?'Manager':'Poranny'}</div>
    </div>`).join('');
  app.innerHTML=`
    <div id="screen-login" class="screen active">
      <div class="login-header">
        <div class="login-title">SCAFO</div>
        <div class="login-sub">Wybierz użytkownika</div>
      </div>
      <div class="user-grid" id="user-grid">
        <div class="user-card" onclick="selectUser('__mgr__')">
          <div class="avatar avatar-lg">MG</div>
          <div class="user-card-name">Manager</div>
          <div class="user-card-role">Panel zarządzania</div>
        </div>
        ${tiles}
      </div>
      <div id="pin-screen" class="pin-screen">
        <div style="text-align:center;margin-bottom:20px">
          <div id="pin-name" style="font-size:16px;font-weight:600"></div>
          <div style="font-size:12px;color:var(--tx2);margin-top:4px">Wpisz PIN</div>
        </div>
        <div id="pin-dots" class="pin-display">····</div>
        <div id="pin-error" style="text-align:center;color:var(--red);font-size:13px;min-height:20px;margin-bottom:8px"></div>
        <div class="pin-grid">
          ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button class="pin-btn${k===''?' pin-back':''}" onclick="pinPress('${k}')">${k}</button>`).join('')}
        </div>
        <button class="btn btn-ghost btn-block" style="margin-top:12px;max-width:280px;margin-left:auto;margin-right:auto" onclick="cancelPin()"><i class="ti ti-arrow-left"></i> Wróć</button>
      </div>
    </div>`;
}

function selectUser(id){
  pinBuffer='';
  pendingUser=id==='__mgr__'?{type:'manager',pin:'0901',name:'Manager'}:DB.workers.find(x=>x.id==id);
  if(!pendingUser)return;
  document.getElementById('pin-name').textContent=pendingUser.name||'Manager';
  document.getElementById('pin-dots').textContent='····';
  document.getElementById('pin-error').textContent='';
  document.getElementById('pin-screen').style.display='block';
  document.getElementById('user-grid').style.display='none';
}

function cancelPin(){
  pinBuffer='';pendingUser=null;
  document.getElementById('pin-screen').style.display='none';
  document.getElementById('user-grid').style.display='grid';
}

function pinPress(k){
  if(k==='⌫'){pinBuffer=pinBuffer.slice(0,-1);}
  else if(k!==''&&pinBuffer.length<4){pinBuffer+=String(k);}
  const dots=document.getElementById('pin-dots');
  if(dots)dots.textContent='●'.repeat(pinBuffer.length)+'·'.repeat(4-pinBuffer.length);
  if(pinBuffer.length===4)setTimeout(checkPin,80);
}

function checkPin(){
  const expected=pendingUser.type==='manager'?'0901':pendingUser.pin;
  if(pinBuffer===expected){
    loginUser(pendingUser);
  } else {
    const err=document.getElementById('pin-error');
    const dots=document.getElementById('pin-dots');
    if(err)err.textContent='Nieprawidłowy PIN';
    if(dots)dots.style.color='var(--red)';
    setTimeout(()=>{
      pinBuffer='';
      if(dots){dots.textContent='····';dots.style.color='';}
      if(err)err.textContent='';
    },600);
  }
}

function loginUser(user){
  currentUser=user;
  if(user.type==='manager'||user.role==='manager'){
    currentUser={type:'manager',name:user.name||'Manager',id:user.id||0};
    buildManagerScreen();
    show('screen-manager');
  } else if(user.role==='piecework'){
    currentUser={type:'piecework',...user};
    buildPwScreen();
    show('screen-piecework');
  } else {
    currentUser={type:'full',...user};
    buildWorkerScreen();
    show('screen-worker');
  }
}

function logout(){currentUser=null;pinBuffer='';pendingUser=null;renderLogin();}

function refreshScreen(){
  if(!currentUser)return;
  if(currentUser.type==='manager'){const t=mgTab;buildManagerScreen();show('screen-manager');mgSwitchTab(t);}
  else if(currentUser.type==='piecework'){buildPwScreen();show('screen-piecework');}
  else{buildWorkerScreen();show('screen-worker');}
}

function pwPreview(){
  const sel=document.getElementById('pw-prod');
  const qty=parseInt(document.getElementById('pw-qty')?.value)||0;
  const shift=document.getElementById('pw-shift')?.value;
  const el=document.getElementById('pw-preview');
  if(!el)return;
  if(sel?.value&&qty>0&&shift==='popołudnie'){
    const rate=parseFloat(sel.options[sel.selectedIndex]?.dataset.rate||0);
    const e=Math.round(rate*qty*100)/100;
    el.textContent=e>0?`Zarobek: ${fmt(e)} zł`:'';
  } else el.textContent='';
}

async function pwSave(){
  const catId=document.getElementById('pw-prod')?.value;
  const qty=parseInt(document.getElementById('pw-qty')?.value)||0;
  const shift=document.getElementById('pw-shift')?.value||'popołudnie';
  if(!catId){showToast('Wybierz produkt',true);return;}
  if(qty<1){showToast('Podaj ilość',true);return;}
  const c=DB.catalog.find(x=>String(x.id)===String(catId));
  const pwDateVal=document.getElementById('pw-date')?.value;
  const pwDate=pwDateVal?isoToPL(pwDateVal):today();
  DB.reports.unshift({id:uid(),user:currentUser.name,catalogId:String(catId),orderId:null,projectId:null,name:c?.name||'',qtyDone:qty,shift,date:pwDate,time:nowTime(),hours:null,notes:'',backdate:pwDate!==today(),seenByManager:false});
  const ok=await save();
  showToast(ok?'Zapisano! ✓':'Zapisano lokalnie',!ok);
  pwSwitch('entry');
}

function renderPwEarnings(){
  const myR=DB.reports.filter(r=>r.user===currentUser.name);
  const byDate={};
  myR.forEach(r=>{
    const nd=normDate(r.date);
    if(!nd)return;
    if(!byDate[nd])byDate[nd]={earn:0,qty:0,reps:[]};
    byDate[nd].earn+=earn(r);byDate[nd].qty+=r.qtyDone;byDate[nd].reps.push(r);
  });
  const now=new Date();
  const calM=pwCalM,calY=pwCalY;
  const monthKeys=Object.keys(byDate).filter(ds=>{const p=ds.split('.');return p.length===3&&parseInt(p[1])-1===calM&&parseInt(p[2])===calY;});
  const monthTotal=monthKeys.reduce((a,ds)=>a+byDate[ds].earn,0);
  const allEarn=myR.reduce((a,r)=>a+earn(r),0);
  const paid=DB.payouts.filter(p=>p.worker===currentUser.name&&p.paid).reduce((a,p)=>a+p.amount,0);
  return `<div style="padding-bottom:20px">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 16px 16px">
      <div class="earn-stat"><div class="earn-stat-val">${fmt(monthTotal)}</div><div class="earn-stat-label">Miesiąc zł</div></div>
      <div class="earn-stat"><div class="earn-stat-val">${fmt(allEarn)}</div><div class="earn-stat-label">Łącznie zł</div></div>
      <div class="earn-stat"><div class="earn-stat-val" style="color:var(--red)">${fmt(Math.max(0,allEarn-paid))}</div><div class="earn-stat-label">Do wypłaty</div></div>
    </div>
    ${buildEarnCal(byDate,calY,calM,'pw')}
    <div id="pw-day-detail"></div>
  </div>`;
}

function pwCalPrev(){pwCalM--;if(pwCalM<0){pwCalM=11;pwCalY--;}pwSwitch('earn');}
function pwCalNext(){pwCalM++;if(pwCalM>11){pwCalM=0;pwCalY++;}pwSwitch('earn');}
function pwDayClick(ds){showDayDetail(ds,'pw-day-detail','pw');}

function buildEarnCal(byDate,calY,calM,pfx){
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  const mn=first.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  let sdow=first.getDay();if(sdow===0)sdow=7;
  const tstr=`${String(new Date().getDate()).padStart(2,'0')}.${String(new Date().getMonth()+1).padStart(2,'0')}.${new Date().getFullYear()}`;
  let cells='';
  for(let i=1;i<sdow;i++)cells+='<div></div>';
  for(let d=1;d<=last.getDate();d++){
    const ds=`${String(d).padStart(2,'0')}.${String(calM+1).padStart(2,'0')}.${calY}`;
    const data=byDate[ds];
    cells+=`<div class="cal-day${data?' has-data':''}${ds===tstr?' today':''}" onclick="${pfx}DayClick('${ds}')">
      <div class="cal-day-num">${d}</div>
      ${data?`<div class="cal-day-qty">${data.qty}szt</div>${data.earn>0?`<div class="cal-day-earn">${fmt(data.earn)}zł</div>`:''}` :''}
    </div>`;
  }
  return `<div style="margin:0 16px">
    <div class="cal-nav">
      <button class="btn btn-ghost btn-sm" onclick="${pfx}CalPrev()"><i class="ti ti-chevron-left"></i></button>
      <div class="cal-nav-title">${mn}</div>
      <button class="btn btn-ghost btn-sm" onclick="${pfx}CalNext()"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid">${['Pn','Wt','Śr','Cz','Pt','Sb','Nd'].map(d=>`<div class="cal-day-name">${d}</div>`).join('')}${cells}</div>
  </div>`;
}

function showDayDetail(ds,containerId,pfx){
  const user=currentUser.name;
  const reps=DB.reports.filter(r=>{
    const nd=normDate(r.date);return nd===ds&&r.user===user;
  });
  const el=document.getElementById(containerId);
  if(!el||!reps.length){if(el)el.innerHTML='';return;}
  const te=reps.reduce((a,r)=>a+earn(r),0);
  const tq=reps.reduce((a,r)=>a+r.qtyDone,0);
  el.innerHTML=`<div class="card" style="margin-top:12px">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <div style="font-weight:600">${ds}</div>
      ${te>0?`<div style="font-weight:700;color:var(--green)">${fmt(te)} zł</div>`:''}
    </div>
    ${reps.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--bdr)">
      <div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:500">${r.name}</span><span style="font-weight:600">${r.qtyDone} szt.</span></div>
      <div style="font-size:11px;color:var(--tx2)">${r.shift} · ${r.time}${earn(r)>0?' · '+fmt(earn(r))+' zł':''}</div>
    </div>`).join('')}
    <div style="font-size:12px;color:var(--tx2);margin-top:8px">Łącznie: ${tq} szt.</div>
  </div>`;
}

function wTypeChg(){
  const t=document.getElementById('w-type').value;
  document.getElementById('w-cat-r').style.display=t==='catalog'?'block':'none';
  document.getElementById('w-ord-r').style.display=t==='order'?'block':'none';
  document.getElementById('w-cust-r').style.display=t==='custom'?'block':'none';
  if(t==='order')wOrdChg();
}

function wOrdChg(){
  const oid=document.getElementById('w-ord')?.value;
  const o=DB.orders.find(x=>String(x.id)===String(oid));
  const ir=document.getElementById('w-ord-item-r');
  const is=document.getElementById('w-ord-item');
  if(o?.items?.length){ir.style.display='block';is.innerHTML=o.items.map((it,i)=>`<option value="${i}">${it.name}</option>`).join('');}
  else ir.style.display='none';
}

function wAddItem(){
  const t=document.getElementById('w-type').value;
  const qty=parseInt(document.getElementById('w-qty').value)||0;
  if(!t||qty<1){showToast('Wybierz typ i podaj ilość',true);return;}
  let name='',catId=null,orderId=null;
  if(t==='catalog'){
    const v=document.getElementById('w-cat').value;
    const c=DB.catalog.find(x=>String(x.id)===String(v));
    if(!c){showToast('Wybierz produkt',true);return;}
    name=c.name;catId=String(v);
  } else if(t==='order'){
    const oid=document.getElementById('w-ord').value;
    const o=DB.orders.find(x=>String(x.id)===String(oid));
    if(!o){showToast('Wybierz zamówienie',true);return;}
    const ir=document.getElementById('w-ord-item-r');
    const is=document.getElementById('w-ord-item');
    const idx=ir.style.display!=='none'?parseInt(is.value):null;
    const item=idx!==null&&o.items?o.items[idx]:null;
    name=o.client+(item?' — '+item.name:'');
    orderId=String(oid);
    if(item?.catId)catId=String(item.catId);
  } else {
    name=document.getElementById('w-cust').value.trim();
    if(!name){showToast('Wpisz nazwę',true);return;}
  }
  wItems.push({name,qty,catId,orderId});
  renderWItems();
  document.getElementById('w-qty').value='';
  document.getElementById('w-type').value='';
  wTypeChg();
}

function renderWItems(){

    <button class="btn btn-ghost btn-sm" onclick="wItems.splice(${i},1);renderWItems()"><i class="ti ti-x"></i></button>

}

  });

  const ok=await save();
  showToast(ok?'Zapisano! ✓':'Zapisano lokalnie',!ok);

}

      </div>

function renderWEarnings(){
  const myR=DB.reports.filter(r=>r.user===currentUser.name);
  const byDate={};
  myR.forEach(r=>{const nd=normDate(r.date);if(!nd)return;if(!byDate[nd])byDate[nd]={earn:0,qty:0,reps:[]};byDate[nd].earn+=earn(r);byDate[nd].qty+=r.qtyDone;byDate[nd].reps.push(r);});
  const now=new Date();
  const mk=Object.keys(byDate).filter(ds=>{const p=ds.split('.');return p.length===3&&parseInt(p[1])-1===wCalM&&parseInt(p[2])===wCalY;});
  const mt=mk.reduce((a,ds)=>a+byDate[ds].earn,0);
  const ae=myR.reduce((a,r)=>a+earn(r),0);
  const paid=DB.payouts.filter(p=>p.worker===currentUser.name&&p.paid).reduce((a,p)=>a+p.amount,0);
  return`<div style="padding-bottom:20px">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 16px 16px">
      <div class="earn-stat"><div class="earn-stat-val">${fmt(mt)}</div><div class="earn-stat-label">Miesiąc zł</div></div>
      <div class="earn-stat"><div class="earn-stat-val">${fmt(ae)}</div><div class="earn-stat-label">Łącznie zł</div></div>
      <div class="earn-stat"><div class="earn-stat-val" style="color:var(--red)">${fmt(Math.max(0,ae-paid))}</div><div class="earn-stat-label">Do wypłaty</div></div>
    </div>
    ${buildEarnCal(byDate,wCalY,wCalM,'w')}
    <div id="w-day-detail"></div>
  </div>`;
}

function mgSwitchTab(tab){

  else if(tab==='reports')el.innerHTML=renderMgReports();
  else if(tab==='warehouse')el.innerHTML=renderMgWarehouse();
  else if(tab==='payouts'){el.innerHTML=renderMgPayouts();setTimeout(()=>paySwitch('summary'),10);}

function mgOrderCard(o,isDone=false){
  const done=orderTotalDone(o.id),pp=pct(done,o.target);
  const dl=o.deadline?Math.ceil((new Date(o.deadline)-new Date())/86400000):null;
  const urg=dl!==null&&dl<=3&&!isDone;
  return`<div class="item" style="flex-direction:column;align-items:stretch;cursor:pointer;${urg?'border:1.5px solid var(--red)':isDone?'border:1.5px solid var(--green)':''}" onclick="openOrderDetail('${o.id}')">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.client}</div>
        ${o.deadline?`<div style="font-size:12px;color:${urg?'var(--red)':isDone?'var(--green)':'var(--tx2)'}">${isDone?'Zrealizowane':dl===0?'Dziś!':dl<0?Math.abs(dl)+'d po term.':'Za '+dl+'d'}</div>`:''}</div>
      <div style="display:flex;gap:4px;align-items:center;flex-shrink:0;margin-left:8px">
        <span class="badge ${isDone?'badge-green':urg?'badge-red':'badge-blue'}">${isDone?'✓':pp+'%'}</span>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openOrderForm('${o.id}')"><i class="ti ti-pencil"></i></button>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();toggleOrderStatus('${o.id}')"><i class="ti ti-${isDone?'refresh':'circle-check'}"></i></button>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deleteOrder('${o.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>
    ${(o.items||[]).map(it=>{const id=orderItemDone(o.id,it.catId,it.name),ip=pct(id,it.qty);return`<div style="font-size:12px;display:flex;justify-content:space-between;margin-bottom:2px"><span>${it.name}</span><span style="color:${ip>=100?'var(--green)':'var(--tx2)'}">${id}/${it.qty}</span></div>`;}).join('')}

function toggleDoneOrders(){
  const el=document.getElementById('done-list');
  const ic=document.getElementById('done-icon');
  if(!el)return;
  const open=el.style.display!=='none';
  el.style.display=open?'none':'block';
  if(ic)ic.style.transform=open?'':'rotate(180deg)';
}

function openOrderForm(oid=null){
  orderItems=[];
  document.getElementById('ord-form-title').textContent=oid?'Edytuj zamówienie':'Nowe zamówienie';
  document.getElementById('ord-id').value=oid||'';
  if(oid){
    const o=DB.orders.find(x=>String(x.id)===String(oid));
    if(o){
      document.getElementById('ord-client').value=o.client;
      document.getElementById('ord-deadline').value=o.deadline||'';
      document.getElementById('ord-link').value=o.link||'';
      orderItems=[...(o.items||[])];
    }
  } else {
    document.getElementById('ord-client').value='';
    document.getElementById('ord-deadline').value='';
    document.getElementById('ord-link').value='';
  }
  renderOrderItems();
  openModal('modal-order');
}

function renderOrderItems(){
  const el=document.getElementById('ord-items');if(!el)return;
  el.innerHTML=orderItems.map((it,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:13px"><div style="flex:1">${it.name} — ${it.qty} szt.${it.stock?` (mag: ${it.stock})`:''}</div><button class="btn btn-ghost btn-sm" onclick="orderItems.splice(${i},1);renderOrderItems()"><i class="ti ti-x"></i></button></div>`).join('');
}

function addOrderItem(){
  const catId=document.getElementById('ord-cat').value;
  const qty=parseInt(document.getElementById('ord-qty').value)||0;
  const stock=parseInt(document.getElementById('ord-stock').value)||0;
  const custom=document.getElementById('ord-custom').value.trim();
  if(qty<1){showToast('Podaj ilość',true);return;}
  if(custom){
    orderItems.push({name:custom,unit:'szt.',catId:null,qty,stock,rate:0});
  } else if(catId){
    const c=DB.catalog.find(x=>String(x.id)===String(catId));
    if(c) orderItems.push({name:c.name,unit:c.unit,catId:String(catId),qty,stock,rate:c.rate||0});
  } else{showToast('Wybierz produkt',true);return;}
  document.getElementById('ord-qty').value='';
  document.getElementById('ord-stock').value='';
  document.getElementById('ord-custom').value='';
  renderOrderItems();
}

async function saveOrder(){
  const client=document.getElementById('ord-client').value.trim();
  if(!client){showToast('Podaj nazwę klienta',true);return;}
  if(!orderItems.length){showToast('Dodaj produkt',true);return;}
  const oid=document.getElementById('ord-id').value;
  const deadline=document.getElementById('ord-deadline').value||null;
  const link=document.getElementById('ord-link').value.trim()||null;
  const target=orderItems.reduce((a,i)=>a+i.qty,0);
  if(oid){
    const idx=DB.orders.findIndex(x=>String(x.id)===String(oid));
    if(idx>=0)DB.orders[idx]={...DB.orders[idx],client,items:orderItems,target,deadline,link};
  } else {
    DB.orders.push({id:uid(),client,items:orderItems,target,deadline,link,status:'active',created:today()});
  }
  closeModal('modal-order');
  const ok=await save();
  showToast(ok?'Zamówienie zapisane!':'Zapisano lokalnie',!ok);
  mgSwitchTab('orders');
}

async function toggleOrderStatus(oid){
  const o=DB.orders.find(x=>String(x.id)===String(oid));
  if(!o)return;
  o.status=o.status==='done'?'active':'done';
  const ok=await save();
  showToast(ok?(o.status==='done'?'Oznaczono jako zrealizowane':'Przywrócono'):'Błąd',!ok);
  mgSwitchTab('orders');
}

async function deleteOrder(oid){
  if(!confirm('Usunąć zamówienie?'))return;
  DB.orders=DB.orders.filter(x=>String(x.id)!==String(oid));
  await save();
  mgSwitchTab('orders');
}

      <div class="form-group"><label class="label">Uwagi</label><textarea id="erep-notes"></textarea></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" style="flex:1" onclick="saveEditRep()"><i class="ti ti-check"></i> Zapisz</button>
        <button class="btn btn-ghost" style="flex:1" onclick="closeModal('modal-edit-rep')">Anuluj</button>
      </div>
    </div></div>
  </div>`;
}

function repCard(r){
  const e=earn(r);
  return`<div class="item">
    <div class="item-main">
      <div class="item-title">${r.name}</div>
      <div class="item-sub">${r.user} · ${r.date} · <span class="badge badge-${r.shift==='popołudnie'?'purple':'blue'}" style="font-size:10px">${r.shift}</span>${e>0?` · ${fmt(e)} zł`:''}</div>
    </div>
    <div style="text-align:right">
      <div style="font-weight:600">${r.qtyDone} szt.</div>
      <div style="display:flex;gap:4px;margin-top:4px">
        <button class="btn btn-ghost btn-sm" onclick="openEditRep(${r.id})"><i class="ti ti-pencil"></i></button>
        <button class="btn btn-ghost btn-sm" onclick="delRep(${r.id})"><i class="ti ti-trash"></i></button>
      </div>
    </div>
  </div>`;
}

function filterRep(){
  const from=document.getElementById('rep-from')?.value;
  const to=document.getElementById('rep-to')?.value;
  const wkr=document.getElementById('rep-wkr')?.value;
  let reps=[...DB.reports];
  if(wkr)reps=reps.filter(r=>r.user===wkr);
  if(from||to)reps=reps.filter(r=>{
    const p=r.date?.split('.');if(p?.length!==3)return true;
    const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    if(from&&d<new Date(from))return false;
    if(to){const te=new Date(to);te.setHours(23,59,59);if(d>te)return false;}
    return true;
  });
  const el=document.getElementById('rep-list');
  if(!el)return;
  reps.sort((a,b)=>b.id-a.id);
  el.innerHTML=reps.slice(0,100).map(r=>repCard(r)).join('');
}

function clearRepFilters(){const f=document.getElementById('rep-from');const t=document.getElementById('rep-to');const w=document.getElementById('rep-wkr');if(f)f.value='';if(t)t.value='';if(w)w.value='';mgSwitchTab('reports');}

function openMgrAddRep(){mgrRepItems=[];renderMrepItems();openModal('modal-add-rep');}
function mrepTypeChg(){
  const t=document.getElementById('mrep-type').value;
  document.getElementById('mrep-cat-r').style.display=t==='catalog'?'block':'none';
  document.getElementById('mrep-ord-r').style.display=t==='order'?'block':'none';
  document.getElementById('mrep-cust-r').style.display=t==='custom'?'block':'none';
}
function mrepAddItem(){
  const t=document.getElementById('mrep-type').value;
  const qty=parseInt(document.getElementById('mrep-qty').value)||0;
  if(!t||qty<1){showToast('Wybierz typ i podaj ilość',true);return;}
  let name='',catId=null,orderId=null;
  if(t==='catalog'){const v=document.getElementById('mrep-cat').value;const c=DB.catalog.find(x=>String(x.id)===String(v));if(!c)return;name=c.name;catId=String(v);}
  else if(t==='order'){const v=document.getElementById('mrep-ord').value;const o=DB.orders.find(x=>String(x.id)===String(v));if(!o)return;name=o.client;orderId=String(v);}
  else{name=document.getElementById('mrep-cust').value.trim();if(!name)return;}
  mgrRepItems.push({name,qty,catId,orderId});
  document.getElementById('mrep-qty').value='';
  renderMrepItems();
}
function renderMrepItems(){const el=document.getElementById('mrep-items');if(!el)return;el.innerHTML=mgrRepItems.map((it,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:13px"><div style="flex:1">${it.name} — ${it.qty} szt.</div><button class="btn btn-ghost btn-sm" onclick="mgrRepItems.splice(${i},1);renderMrepItems()"><i class="ti ti-x"></i></button></div>`).join('');}
async function saveMgrRep(){
  if(!mgrRepItems.length){showToast('Dodaj pozycje',true);return;}
  const wkr=document.getElementById('mrep-wkr').value;
  const shift=document.getElementById('mrep-shift').value;
  const hours=parseFloat(document.getElementById('mrep-hours').value)||null;
  const dateVal=document.getElementById('mrep-date').value;
  const entryDate=dateVal?isoToPL(dateVal):today();
  mgrRepItems.forEach((it,idx)=>{
    DB.reports.unshift({id:uid()+idx,user:wkr,catalogId:it.catId||null,orderId:it.orderId||null,projectId:null,name:it.name,qtyDone:it.qty,shift,hours,notes:'',date:entryDate,time:nowTime(),backdate:entryDate!==today(),seenByManager:true,addedByManager:true});
  });
  mgrRepItems=[];
  closeModal('modal-add-rep');
  const ok=await save();
  showToast(ok?'Wpis dodany!':'Zapisano lokalnie',!ok);
  mgSwitchTab('reports');
}

function openEditRep(rid){
  const r=DB.reports.find(x=>x.id==rid);if(!r)return;
  document.getElementById('erep-id').value=rid;
  document.getElementById('erep-name').value=r.name;
  document.getElementById('erep-qty').value=r.qtyDone;
  document.getElementById('erep-shift').value=r.shift||'rano';
  document.getElementById('erep-date').value=plToISO(r.date);
  document.getElementById('erep-notes').value=r.notes||'';
  openModal('modal-edit-rep');
}

async function saveEditRep(){
  const rid=document.getElementById('erep-id').value;
  const r=DB.reports.find(x=>x.id==rid);if(!r)return;
  r.name=document.getElementById('erep-name').value.trim()||r.name;
  r.qtyDone=parseInt(document.getElementById('erep-qty').value)||r.qtyDone;
  r.shift=document.getElementById('erep-shift').value;
  r.notes=document.getElementById('erep-notes').value.trim();
  const d=document.getElementById('erep-date').value;
  if(d){r.date=isoToPL(d);r.backdate=r.date!==today();}
  closeModal('modal-edit-rep');
  const ok=await save();
  showToast(ok?'Zaktualizowano!':'Zapisano lokalnie',!ok);
  mgSwitchTab('reports');
}

async function delRep(rid){
  if(!confirm('Usunąć wpis?'))return;
  DB.reports=DB.reports.filter(x=>x.id!=rid);
  const ok=await save();
  showToast(ok?'Usunięto!':'Zapisano lokalnie',!ok);
  mgSwitchTab('reports');
}

  if(tab==='summary')el.innerHTML=renderPaySummary();
  else el.innerHTML=renderPayHistory();

function earnInRange(workerName, from, to){
  return DB.reports.filter(r=>{
    if(r.user!==workerName)return false;
    if(!from&&!to)return true;
    const p=r.date?.split('.');
    if(p?.length!==3)return true;
    const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
    if(from&&d<new Date(from))return false;
    if(to){const te=new Date(to);te.setHours(23,59,59);if(d>te)return false;}
    return true;
  }).reduce((a,r)=>a+earn(r),0);
}

function renderPaySummary(){
  const from=payFilterFrom;
  const to=payFilterTo;
  const totalEarned=DB.workers.reduce((a,w)=>a+earnInRange(w.name,from,to),0);
  const totalPaid=DB.payouts.filter(p=>p.paid).reduce((a,p)=>a+p.amount,0);
  const totalDue=DB.workers.reduce((a,w)=>{
    const earned=DB.reports.filter(r=>r.user===w.name).reduce((s,r)=>s+earn(r),0);
    const paid=DB.payouts.filter(p=>p.worker===w.name&&p.paid).reduce((s,p)=>s+p.amount,0);
    return a+Math.max(0,earned-paid);
  },0);

  return`<div>
    <!-- Filtry dat -->
    <div class="card">
      <div style="font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:8px">FILTR ZAROBKÓW WG DAT</div>

function renderPaySummaryRefresh(){
  const el=document.getElementById('pay-content');
  if(el)el.innerHTML=renderPaySummary();
}

function renderPayHistory(){
  const sorted=[...DB.payouts].sort((a,b)=>{
    const da=new Date(a.paidAt||plToISO(a.date)||'2000-01-01');
    const db=new Date(b.paidAt||plToISO(b.date)||'2000-01-01');
    return db-da;
  });
  if(!sorted.length)return`<div class="empty"><i class="ti ti-cash"></i><p>Brak historii wypłat</p></div>`;
  
  // Group by worker
  const byW={};
  sorted.forEach(p=>{if(!byW[p.worker])byW[p.worker]=[];byW[p.worker].push(p);});
  
  return`<div>
    ${Object.entries(byW).map(([worker,pays])=>{
      const total=pays.reduce((a,p)=>a+p.amount,0);
      return`<div class="section"><div class="section-title">${worker} · ${fmt(total)} zł łącznie</div></div>
      ${pays.map(p=>`<div class="item">
        <div class="item-main">
          <div class="item-title">${p.date}</div>
          <div class="item-sub">${p.notes||'Wypłata'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-weight:700;color:var(--green)">${fmt(p.amount)} zł</div>
          <button class="btn btn-ghost btn-sm" onclick="delPayout(${p.id})"><i class="ti ti-trash"></i></button>
        </div>
      </div>`).join('')}`;
    }).join('')}
  </div>`;
}

let _payoutWorker='';

function openPayoutModal(worker, due){
  _payoutWorker=worker;
  document.getElementById('payout-worker-name').textContent=worker;
  document.getElementById('payout-amount').value=due>0?due.toFixed(2):'';
  document.getElementById('payout-date').value=todayISO();

}

async function confirmPayout(){
  const amount=parseFloat(document.getElementById('payout-amount').value)||0;
  if(amount<=0){showToast('Podaj kwotę',true);return;}
  const dateVal=document.getElementById('payout-date').value;
  const date=dateVal?isoToPL(dateVal):today();
  const notes=document.getElementById('payout-notes').value.trim();
  DB.payouts.unshift({id:uid(),worker:_payoutWorker,amount,date,notes,paid:true,paidAt:dateVal||todayISO()});
  closeModal('modal-payout');
  const ok=await save();
  showToast(ok?'Wypłata zapisana!':'Zapisano lokalnie',!ok);
  mgSwitchTab('payouts');
}

async function delPayout(pid){
  if(!confirm('Usunąć wypłatę?'))return;
  DB.payouts=DB.payouts.filter(x=>x.id!=pid);
  const ok=await save();
  showToast(ok?'Usunięto':'Błąd',!ok);
  mgSwitchTab('payouts');
}

async function markPayout(worker,amount){

}

let wAkordCalY=new Date().getFullYear(),wAkordCalM=new Date().getMonth();
let wStdCalY=new Date().getFullYear(),wStdCalM=new Date().getMonth();

function buildCalGrid(calY,calM,byDate,clickFn,dayRenderer){
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  const mn=first.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  let sdow=first.getDay();if(sdow===0)sdow=7;
  const tiso=todayISO();
  let cells='';
  for(let i=1;i<sdow;i++)cells+='<div></div>';
  for(let d=1;d<=last.getDate();d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const data=byDate[ds];
    const isT=ds===tiso;
    cells+=`<div onclick="${clickFn}('${ds}')" style="min-height:52px;border-radius:var(--rsm);background:${data?'var(--bg3)':'var(--bg2)'};padding:3px;cursor:${data?'pointer':'default'};border:1.5px solid ${isT?'var(--blue)':'transparent'}">
      <div style="font-size:11px;font-weight:500;color:${isT?'var(--blue)':'var(--tx)'}">${d}</div>
      ${data?dayRenderer(data):''}
    </div>`;
  }
  return {mn, cells};
}

// WORKER CALENDAR — STANDARD
// ══════════════════════════════════
function renderWorkerStdCal(){
  const calY=wStdCalY,calM=wStdCalM;
  // Build events by ISO date
  const byDate={};
  const addEv=(ds,type,label)=>{if(!ds)return;if(!byDate[ds])byDate[ds]=[];byDate[ds].push({type,label});};

  // My standard reports (rano or no shift) or any report linked to order/catalog
  DB.reports.filter(r=>r.user===currentUser.name&&r.shift!=='popołudnie').forEach(r=>{
    const p=r.date?.split('.');
    const ds=p?.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:null;
    if(ds)addEv(ds,'report',r.name);
  });
  // Order reports (zamówienia)
  DB.reports.filter(r=>r.user===currentUser.name&&r.orderId).forEach(r=>{
    const p=r.date?.split('.');
    const ds=p?.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:null;
    const o=DB.orders.find(x=>String(x.id)===String(r.orderId));
    if(ds&&o)addEv(ds,'order',o.client);
  });
  // Order deadlines
  DB.orders.forEach(o=>{if(o.deadline&&o.status==='active')addEv(o.deadline,'deadline',o.client);});
  // Vacations for this user
  DB.vacations.filter(v=>v.worker===currentUser.name).forEach(v=>{
    const s=new Date(v.start),e=new Date(v.end);
    for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))addEv(d.toISOString().slice(0,10),'vacation','Urlop');
  });

  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  const mn=first.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  let sdow=first.getDay();if(sdow===0)sdow=7;
  const tiso=todayISO();
  let cells='';
  for(let i=1;i<sdow;i++)cells+='<div></div>';
  for(let d=1;d<=last.getDate();d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=byDate[ds]||[];
    const isT=ds===tiso;
    const dots=evs.slice(0,2).map(e=>`<div style="font-size:9px;border-radius:2px;padding:0 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:${e.type==='deadline'?'#FAEEDA':e.type==='vacation'?'#EEEDFE':e.type==='order'?'#E1F5EE':'#E6F1FB'};color:${e.type==='deadline'?'#633806':e.type==='vacation'?'#3C3489':e.type==='order'?'#085041':'#0C447C'}">${e.label}</div>`).join('');
    cells+=`<div onclick="wStdDayClick('${ds}')" style="min-height:52px;border-radius:var(--rsm);background:${evs.length?'var(--bg3)':'var(--bg2)'};padding:3px;cursor:${evs.length?'pointer':'default'};border:1.5px solid ${isT?'var(--blue)':'transparent'}">
      <div style="font-size:11px;font-weight:500;color:${isT?'var(--blue)':'var(--tx)'}">${d}</div>${dots}
    </div>`;
  }
  return`<div style="padding:0 16px 20px">

let mgCalSubTab='std';

function renderMgCalContainer(){
  return`<div>
    <div class="tabs" style="padding:0 16px 12px">
      <button class="tab active" id="mgcal-tab-std" onclick="mgCalSwitch('std')">Standard</button>
      <button class="tab" id="mgcal-tab-akord" onclick="mgCalSwitch('akord')">Akord</button>
    </div>
    <div id="mgcal-content"></div>
  </div>`;
}

function mgCalSwitch(tab){
  mgCalSubTab=tab;
  document.querySelectorAll('[id^="mgcal-tab-"]').forEach(b=>b.classList.toggle('active',b.id===`mgcal-tab-${tab}`));
  const el=document.getElementById('mgcal-content');
  if(!el)return;
  if(tab==='std')el.innerHTML=renderCalTab(true);
  else el.innerHTML=renderMgAkordCal();
}

function renderMgAkordCal(){
  const calY=mgCalY,calM=mgCalM;
  // Group piecework reports by ISO date
  const byDate={};
  DB.reports.filter(r=>r.shift==='popołudnie').forEach(r=>{
    const p=r.date?.split('.');
    const ds=p?.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:null;
    if(!ds)return;
    if(!byDate[ds])byDate[ds]={earn:0,qty:0,reps:[]};
    byDate[ds].earn+=earn(r);
    byDate[ds].qty+=r.qtyDone;
    byDate[ds].reps.push(r);
  });
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  const mn=first.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  let sdow=first.getDay();if(sdow===0)sdow=7;
  const tiso=todayISO();
  const monthKeys=Object.keys(byDate).filter(ds=>{const p=ds.split('-');return p.length===3&&parseInt(p[1])-1===calM&&parseInt(p[0])===calY;});
  const monthEarn=monthKeys.reduce((a,ds)=>a+byDate[ds].earn,0);
  const monthQty=monthKeys.reduce((a,ds)=>a+byDate[ds].qty,0);
  let cells='';
  for(let i=1;i<sdow;i++)cells+='<div></div>';
  for(let d=1;d<=last.getDate();d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const data=byDate[ds];
    const isT=ds===tiso;
    cells+=`<div onclick="mgAkordDayClick('${ds}')" style="min-height:52px;border-radius:var(--rsm);background:${data?'var(--lgreen)':'var(--bg2)'};padding:3px;cursor:${data?'pointer':'default'};border:1.5px solid ${isT?'var(--blue)':'transparent'}">
      <div style="font-size:11px;font-weight:500;color:${isT?'var(--blue)':'var(--tx)'}">${d}</div>
      ${data?`<div style="font-size:9px;color:var(--tx2)">${data.qty} szt.</div><div style="font-size:9px;color:var(--green);font-weight:600">${fmt(data.earn)} zł</div>`:''}
    </div>`;
  }
  return`<div style="padding:0 16px 20px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;margin-top:4px">
      <div class="earn-stat"><div class="earn-stat-val">${fmt(monthEarn)} zł</div><div class="earn-stat-label">Zarobki w miesiącu</div></div>
      <div class="earn-stat"><div class="earn-stat-val">${monthQty}</div><div class="earn-stat-label">Szt. w miesiącu</div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <button class="btn btn-ghost btn-sm" onclick="mgAkordCalPrev()"><i class="ti ti-chevron-left"></i></button>
      <div class="cal-nav-title">${mn}</div>
      <button class="btn btn-ghost btn-sm" onclick="mgAkordCalNext()"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px">
      ${['Pn','Wt','Śr','Cz','Pt','Sb','Nd'].map(d=>`<div class="cal-day-name">${d}</div>`).join('')}${cells}
    </div>
    <div id="mgakord-day-detail" style="margin-top:8px"></div>
    
    <!-- Edit modal dla managera -->
    <div id="modal-mgakord-edit" class="modal-overlay"><div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="modal-title" style="margin:0">Edytuj wpis akordowy</div>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-mgakord-edit')"><i class="ti ti-x"></i></button>
      </div>
      <input type="hidden" id="mgakord-edit-id">
      <div class="form-group"><label class="label">Pracownik</label><input type="text" id="mgakord-edit-worker" readonly style="background:var(--bg3)"></div>
      <div class="form-group"><label class="label">Produkt</label>
        <select id="mgakord-edit-cat">${sortedCatalog('piecework').map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label class="label">Ilość (szt.)</label><input type="number" id="mgakord-edit-qty" min="1" inputmode="numeric"></div>
      <div class="form-group"><label class="label">Data</label><input type="date" id="mgakord-edit-date"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" style="flex:1" onclick="saveMgAkordEdit()"><i class="ti ti-check"></i> Zapisz</button>
        <button class="btn btn-danger btn-sm" onclick="deleteMgAkordEntry()"><i class="ti ti-trash"></i></button>
        <button class="btn btn-ghost" style="flex:1" onclick="closeModal('modal-mgakord-edit')">Anuluj</button>
      </div>
    </div></div>
  </div>`;
}

function mgAkordCalPrev(){mgCalM--;if(mgCalM<0){mgCalM=11;mgCalY--;}mgCalSwitch('akord');}
function mgAkordCalNext(){mgCalM++;if(mgCalM>11){mgCalM=0;mgCalY++;}mgCalSwitch('akord');}

function mgAkordDayClick(ds){
  const el=document.getElementById('mgakord-day-detail');if(!el)return;
  const reps=DB.reports.filter(r=>{
    if(r.shift!=='popołudnie')return false;
    const p=r.date?.split('.');
    return p?.length===3&&`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`===ds;
  });
  if(!reps.length){el.innerHTML='';return;}
  const date=new Date(ds).toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
  const totalEarn=reps.reduce((a,r)=>a+earn(r),0);
  const totalQty=reps.reduce((a,r)=>a+r.qtyDone,0);
  // Group by worker
  const byW={};
  reps.forEach(r=>{if(!byW[r.user])byW[r.user]=[];byW[r.user].push(r);});
  el.innerHTML=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-weight:600;text-transform:capitalize">${date}</div>
      <div style="text-align:right">
        <div style="font-weight:700;color:var(--green)">${fmt(totalEarn)} zł</div>
        <div style="font-size:11px;color:var(--tx2)">${totalQty} szt.</div>
      </div>
    </div>
    ${Object.entries(byW).map(([worker,wreps])=>`
      <div style="margin-bottom:10px">
        <div style="font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px">${worker}</div>
        ${wreps.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--bdr)">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:13px;font-weight:500">${r.name}</div>
              <div style="font-size:11px;color:var(--tx2)">${r.time}${earn(r)>0?' · '+fmt(earn(r))+' zł':''}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="font-size:14px;font-weight:600">${r.qtyDone} szt.</div>
              <button class="btn btn-ghost btn-sm" onclick="openMgAkordEdit(${r.id})"><i class="ti ti-pencil"></i></button>
            </div>
          </div>
        </div>`).join('')}
      </div>
    `).join('')}
  </div>`;
}

function openMgAkordEdit(rid){
  const r=DB.reports.find(x=>x.id==rid);if(!r)return;
  document.getElementById('mgakord-edit-id').value=rid;
  document.getElementById('mgakord-edit-worker').value=r.user;
  const catSel=document.getElementById('mgakord-edit-cat');
  if(catSel&&r.catalogId)catSel.value=r.catalogId;
  document.getElementById('mgakord-edit-qty').value=r.qtyDone;
  document.getElementById('mgakord-edit-date').value=plToISO(r.date);
  openModal('modal-mgakord-edit');
}

async function saveMgAkordEdit(){
  const rid=document.getElementById('mgakord-edit-id').value;
  const r=DB.reports.find(x=>x.id==rid);if(!r)return;
  const catId=document.getElementById('mgakord-edit-cat').value;
  const c=DB.catalog.find(x=>String(x.id)===String(catId));
  r.catalogId=catId;
  r.name=c?.name||r.name;
  r.qtyDone=parseInt(document.getElementById('mgakord-edit-qty').value)||r.qtyDone;
  const d=document.getElementById('mgakord-edit-date').value;
  if(d)r.date=isoToPL(d);
  closeModal('modal-mgakord-edit');
  const ok=await save();
  showToast(ok?'Zaktualizowano!':'Zapisano lokalnie',!ok);
  mgCalSwitch('akord');
}

async function deleteMgAkordEntry(){
  const rid=document.getElementById('mgakord-edit-id').value;
  if(!confirm('Usunąć wpis?'))return;
  DB.reports=DB.reports.filter(x=>x.id!=rid);
  closeModal('modal-mgakord-edit');
  const ok=await save();
  showToast(ok?'Usunięto':'Błąd',!ok);
  mgCalSwitch('akord');
}

function renderCalTab(isMgr=true){
  const calY=mgCalY,calM=mgCalM;
  const events={};
  const addEv=(ds,type,label)=>{if(!ds)return;if(!events[ds])events[ds]=[];events[ds].push({type,label});};
  DB.orders.forEach(o=>{if(o.deadline&&o.status==='active')addEv(o.deadline,'deadline',o.client);});
  DB.shipments.filter(s=>s.confirmed).forEach(s=>{if(s.date){const p=s.date.split('.');if(p.length===3)addEv(`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`,'shipment',s.client);}});
  const rds=[...new Set(DB.reports.map(r=>{if(!r.date)return null;const p=r.date.split('.');return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:null}).filter(Boolean))];
  rds.forEach(ds=>addEv(ds,'report','Raporty'));
  DB.vacations.forEach(v=>{const s=new Date(v.start),e=new Date(v.end);for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))addEv(d.toISOString().slice(0,10),'vacation',v.worker);});
  DB.payouts.filter(p=>p.paid&&p.paidAt).forEach(p=>addEv(p.paidAt,'payout',fmt(p.amount)+' zł'));
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  const mn=first.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  let sdow=first.getDay();if(sdow===0)sdow=7;
  const tiso=todayISO();
  let cells='';
  for(let i=1;i<sdow;i++)cells+='<div></div>';
  for(let d=1;d<=last.getDate();d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=events[ds]||[];
    const isT=ds===tiso;
    const dots=evs.slice(0,3).map(e=>`<div style="font-size:9px;border-radius:2px;padding:0 2px;background:${e.type==='deadline'?'#FAEEDA':e.type==='vacation'?'#EEEDFE':e.type==='report'?'#E6F1FB':e.type==='payout'?'#EAF3DE':'#E1F5EE'};color:${e.type==='deadline'?'#633806':e.type==='vacation'?'#3C3489':e.type==='report'?'#0C447C':e.type==='payout'?'#3B6D11':'#085041'};overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${e.label}</div>`).join('');
    cells+=`<div onclick="calDayClick('${ds}')" style="min-height:52px;border-radius:var(--rsm);background:${evs.length?'var(--bg3)':'var(--bg2)'};padding:3px;cursor:${evs.length?'pointer':'default'};border:1.5px solid ${isT?'var(--blue)':'transparent'}">
      <div style="font-size:11px;font-weight:500;color:${isT?'var(--blue)':'var(--tx)'}">${d}</div>${dots}</div>`;
  }
  return`<div style="padding:0 16px 20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:4px">
      <button class="btn btn-ghost btn-sm" onclick="calPrev()"><i class="ti ti-chevron-left"></i></button>
      <div class="cal-nav-title">${mn}</div>
      <button class="btn btn-ghost btn-sm" onclick="calNext()"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px;font-size:10px;flex-wrap:wrap">
      <span style="background:#FAEEDA;color:#633806;padding:2px 6px;border-radius:4px">Termin</span>
      <span style="background:#E1F5EE;color:#085041;padding:2px 6px;border-radius:4px">Wydanie</span>
      <span style="background:#E6F1FB;color:#0C447C;padding:2px 6px;border-radius:4px">Raporty</span>
      <span style="background:#EEEDFE;color:#3C3489;padding:2px 6px;border-radius:4px">Urlop</span>
      <span style="background:#EAF3DE;color:#3B6D11;padding:2px 6px;border-radius:4px">Wypłata</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px">
      ${['Pn','Wt','Śr','Cz','Pt','Sb','Nd'].map(d=>`<div class="cal-day-name">${d}</div>`).join('')}${cells}
    </div>
    <div id="cal-day-detail" style="margin-top:8px"></div>
    <div class="card" style="margin-top:12px">
      <div class="card-title">Zaplanuj urlop</div>
      <div class="form-group"><label class="label">Pracownik</label><select id="vac-wkr">${DB.workers.map(w=>`<option value="${w.name}">${w.name}</option>`).join('')}</select></div>
      <div style="display:flex;gap:8px">
        <div style="flex:1"><label class="label">Od</label><input type="date" id="vac-start"></div>
        <div style="flex:1"><label class="label">Do</label><input type="date" id="vac-end"></div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="saveVac()"><i class="ti ti-beach"></i> Dodaj urlop</button>
    </div>
    ${DB.vacations.map(v=>`<div class="item"><div class="item-main"><div class="item-title">${v.worker}</div><div class="item-sub">${isoToPL(v.start)} – ${isoToPL(v.end)}</div></div><button class="btn btn-ghost btn-sm" onclick="delVac(${v.id})"><i class="ti ti-trash"></i></button></div>`).join('')}
  </div>`;
}

function calPrev(){mgCalM--;if(mgCalM<0){mgCalM=11;mgCalY--;}mgSwitchTab('calendar');}
function calNext(){mgCalM++;if(mgCalM>11){mgCalM=0;mgCalY++;}mgSwitchTab('calendar');}

function calDayClick(ds){
  const el=document.getElementById('cal-day-detail');if(!el)return;
  const deadlines=DB.orders.filter(o=>o.deadline===ds&&o.status==='active');
  const shs=DB.shipments.filter(s=>{if(!s.date)return false;const p=s.date.split('.');return p.length===3&&`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`===ds;});
  const vacs=DB.vacations.filter(v=>ds>=v.start&&ds<=v.end);
  const reps=DB.reports.filter(r=>{if(!r.date)return false;const p=r.date.split('.');return p.length===3&&`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`===ds;});
  const pays=DB.payouts.filter(p=>p.paid&&p.paidAt===ds);
  if(!deadlines.length&&!shs.length&&!vacs.length&&!reps.length&&!pays.length){el.innerHTML='';return;}
  const date=new Date(ds).toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
  const totalPay=pays.reduce((a,p)=>a+p.amount,0);
  el.innerHTML=`<div class="card">
    <div style="font-weight:600;margin-bottom:10px;text-transform:capitalize">${date}</div>
    ${deadlines.map(o=>`<div style="padding:6px 0;border-bottom:1px solid var(--bdr)"><span class="badge badge-amber" style="margin-right:6px">Termin</span>${o.client} · ${pct(orderTotalDone(o.id),o.target)}%</div>`).join('')}
    ${shs.map(s=>`<div style="padding:6px 0;border-bottom:1px solid var(--bdr)"><span class="badge badge-teal" style="margin-right:6px">Wydanie</span>${s.client}</div>`).join('')}
    ${vacs.map(v=>`<div style="padding:6px 0;border-bottom:1px solid var(--bdr)"><span class="badge badge-purple" style="margin-right:6px">Urlop</span>${v.worker}</div>`).join('')}
    ${pays.map(p=>`<div style="padding:6px 0;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center"><div><span class="badge badge-green" style="margin-right:6px">Wypłata</span>${p.worker}</div><div style="font-weight:700;color:var(--green)">${fmt(p.amount)} zł</div></div>`).join('')}
    ${pays.length>1?`<div style="padding:6px 0;font-size:12px;font-weight:600;color:var(--green)">Łącznie wypłat: ${fmt(totalPay)} zł</div>`:''}
    ${reps.length?`<div style="padding:6px 0"><span class="badge badge-blue" style="margin-right:6px">Raporty</span>${reps.length} wpisów · ${reps.reduce((a,r)=>a+r.qtyDone,0)} szt.</div>`:''}
  </div>`;
}

async function saveVac(){
  const wkr=document.getElementById('vac-wkr')?.value;
  const start=document.getElementById('vac-start')?.value;
  const end=document.getElementById('vac-end')?.value;
  if(!wkr||!start||!end){showToast('Wypełnij wszystkie pola',true);return;}
  if(end<start){showToast('Błędne daty',true);return;}
  DB.vacations.push({id:uid(),worker:wkr,start,end,notes:''});
  const ok=await save();
  showToast(ok?'Urlop dodany!':'Zapisano lokalnie',!ok);
  mgSwitchTab('calendar');
}

async function delVac(vid){
  if(!confirm('Usunąć urlop?'))return;
  DB.vacations=DB.vacations.filter(x=>x.id!=vid);
  await save();
  mgSwitchTab('calendar');
}

  return`<div style="padding-bottom:20px">

    <div class="section"><div class="section-title">Eksport / Import</div></div>
    <div style="display:flex;gap:8px;padding:0 16px">
      <button class="btn btn-ghost" style="flex:1" onclick="exportData()"><i class="ti ti-download"></i> Eksport JSON</button>

    </div>
    <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importData(event)">
    
    <div class="section" style="margin-top:8px"><div class="section-title">Zerowanie</div></div>
    <div style="padding:0 16px">
      <div style="background:var(--lred);border-radius:var(--r);padding:14px;margin-bottom:10px">

function openCatForm(cid=null){
  document.getElementById('cat-form-title').textContent=cid?'Edytuj produkt':'Nowy produkt';
  document.getElementById('cat-id').value=cid||'';
  if(cid){const c=DB.catalog.find(x=>String(x.id)===String(cid));if(c){document.getElementById('cat-name').value=c.name;document.getElementById('cat-unit').value=c.unit||'szt.';document.getElementById('cat-rate').value=c.rate||0;document.getElementById('cat-pw').checked=!!c.piecework;document.getElementById('cat-stock').checked=c.stockItem!==false;}}
  else{document.getElementById('cat-name').value='';document.getElementById('cat-unit').value='szt.';document.getElementById('cat-rate').value='';document.getElementById('cat-pw').checked=false;document.getElementById('cat-stock').checked=true;}
  openModal('modal-cat');
}

async function saveCat(){
  const name=document.getElementById('cat-name').value.trim();
  if(!name){showToast('Podaj nazwę',true);return;}
  const cid=document.getElementById('cat-id').value;
  const item={name,unit:document.getElementById('cat-unit').value||'szt.',rate:parseFloat(document.getElementById('cat-rate').value)||0,piecework:document.getElementById('cat-pw').checked,stockItem:document.getElementById('cat-stock').checked,created:today()};
  if(cid){const idx=DB.catalog.findIndex(x=>String(x.id)===String(cid));if(idx>=0)DB.catalog[idx]={...DB.catalog[idx],...item};}
  else DB.catalog.push({id:uid(),...item});
  closeModal('modal-cat');
  const ok=await save();
  showToast(ok?'Produkt zapisany!':'Zapisano lokalnie',!ok);
  mgSwitchTab('settings');
}

async function delCat(cid){
  if(!confirm('Usunąć produkt?'))return;
  DB.catalog=DB.catalog.filter(x=>String(x.id)!==String(cid));
  await save();
  mgSwitchTab('settings');
}

async function listBkp(){
  const el=document.getElementById('bkp-list');if(!el)return;
  el.innerHTML='<div style="font-size:12px;color:var(--tx2)">Ładowanie...</div>';
  try{
    const rows=await supaFetch('/rest/v1/scafo_backups?select=id,date,created_at&order=created_at.desc&limit=24');
    if(!rows?.length){el.innerHTML='<div style="font-size:12px;color:var(--tx2)">Brak backupów.</div>';return;}
    el.innerHTML=rows.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:12px">
      <div>${r.date} ${r.created_at?new Date(r.created_at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}):''}</div>
      <button class="btn btn-ghost btn-sm" onclick="restoreBkp('${r.id}')"><i class="ti ti-refresh"></i> Przywróć</button>
    </div>`).join('');
  }catch(e){el.innerHTML='<div style="font-size:12px;color:var(--red)">Błąd ładowania.</div>';}
}

async function restoreBkp(bid){
  if(!confirm('Przywrócić dane? Aktualne zostaną zastąpione.'))return;
  try{
    const rows=await supaFetch(`/rest/v1/scafo_backups?id=eq.${bid}&select=data`);
    if(!rows?.length)throw new Error('Nie znaleziono backupu');
    const data=JSON.parse(rows[0].data);
    const keys=['workers','catalog','orders','reports','shipments','adjustments','payouts','transports','vacations'];
    keys.forEach(k=>{if(data[k])DB[k]=data[k];});
    await save();
    showToast('Dane przywrócone!');
    mgSwitchTab('settings');
  }catch(e){showToast('Błąd: '+e.message,true);}
}

async function clearWarehouse(){
  if(!confirm('Wyzerować magazyn?\n\nZostaną usunięte:\n• Wszystkie wydania\n• Wszystkie korekty\n• Raporty produkcji na stan (bez zamówienia)\n\nRaporty do zamówień zostają.'))return;
  DB.shipments=[];
  DB.adjustments=[];
  DB.reports=DB.reports.filter(r=>r.orderId);
  const ok=await save();
  showToast(ok?'Magazyn wyzerowany!':'Zapisano lokalnie',!ok);
  mgSwitchTab('settings');
}

function exportData(){
  const data=JSON.stringify({version:8,exportDate:today(),...DB},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`scafo_backup_${today().replace(/\./g,'-')}.json`;
  a.click();URL.revokeObjectURL(url);
  showToast('Eksport gotowy!');
}

async function importData(e){
  const file=e.target.files[0];if(!file)return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    const keys=['workers','catalog','orders','reports','shipments','adjustments','payouts','transports','vacations'];
    keys.forEach(k=>{if(data[k])DB[k]=data[k];});
    const ok=await save();
    showToast(ok?'Import zakończony!':'Import lokalny',!ok);
    if(currentUser?.type==='manager')buildManagerScreen();
  }catch(err){showToast('Błąd importu: '+err.message,true);}
  e.target.value='';
}

// Wyrejestruj wszystkie stare service workery (powodowały cache problemy)
if('serviceWorker'in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  });
}

window.addEventListener('error',e=>{
  console.error('Error:',e.message,e.lineno);
  if(typeof showToast==='function')showToast('Błąd: '+e.message,true);
});
window.addEventListener('unhandledrejection',e=>{
  console.error('Rejection:',e.reason);
});
